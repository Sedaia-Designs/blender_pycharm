version: "1.0"
linter: jetbrains/qodana-jvm:2026.1
projectJDK: "21"

# Use the broader recommended profile so reports are suitable for release
# hardening rather than only showing the starter inspection set.
profile:
  name: qodana.recommended

# Import only this repository's root Gradle project.
rootJavaProjects:
  - "."

# Consolidate formatting findings into one actionable problem per file.
include:
  - name: IncorrectFormatting
  - name: CheckDependencyLicenses

# Show license incompatibilities in Current problems as well as License audit.
raiseLicenseProblems: true

# Keep generated files and tool state out of findings and report navigation.
exclude:
  - name: All
    paths:
      - ".gradle"
      - ".intellijPlatform"
      - "build"
