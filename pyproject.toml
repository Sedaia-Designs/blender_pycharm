[project]
name = "blender-pycharm"
version = "1.0.0"
description = "Blender Development plugin and Blender runtime support"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "autopep8==2.3.2",
    "debugpy>=1.8",
    "fake-bpy-module-4-2==20260730",
    "flask<=3.1.3",
    "pytest>=8.0",
    "requests<=2.33.0",
    "ruff>=0.9",
    "werkzeug<=3.1.6",
]

[tool.pytest.ini_options]
testpaths = ["src/test/python"]
pythonpath = ["src/main/python"]
