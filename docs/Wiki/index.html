<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blender Development Wiki</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --line: #d0d7de;
      --code-bg: #f6f8fa;
      --accent: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --line: #30363d;
        --code-bg: #161b22;
        --accent: #58a6ff;
      }
    }
    body {
      margin: 0;
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    h1 { margin-top: 0; }
    .muted { color: var(--muted); }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: color-mix(in srgb, var(--code-bg) 66%, var(--bg));
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
      background: var(--code-bg);
      padding: 0.1em 0.32em;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Blender Development Wiki</h1>
    <p class="muted">Documentation root for internal and project-facing wiki sets.</p>
  </header>

  <section class="card-grid" aria-label="Wiki sets">
    <article class="card">
      <h2><a href="./project/index.html">Project Wiki</a></h2>
      <p>Public/project-oriented technical documentation for architecture, setup, and workflows.</p>
    </article>
    <article class="card">
      <h2><a href="./internal/index.html">Internal Wiki</a></h2>
      <p>Internal reference pages, audits, and source-mapping notes used during implementation work.</p>
    </article>
  </section>
</main>
</body>
</html>
