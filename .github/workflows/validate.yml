name: Validate and prepare release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.7'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.7'
      - name: Run required gates
        if: github.event_name != 'workflow_dispatch'
        run: bash scripts/ci-gates.sh validate
      - name: Build and verify release
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/ci-gates.sh prepare
      - name: Record source identity
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf 'SOURCE_SHA=%s\n' "$GITHUB_SHA" >> .release/release.env
          printf 'SOURCE_RUN_ID=%s\n' "$GITHUB_RUN_ID" >> .release/release.env
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: validated-release
          path: |
            build/distributions/BlenderPythonDevelopment-*.zip
            .release/release.env
            .release/release-notes.md
            .release/SHA256SUMS
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
