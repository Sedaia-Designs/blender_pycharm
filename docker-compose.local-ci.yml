services:
  local-ci:
    build:
      context: .
      dockerfile: docker/local-ci/Dockerfile
    environment:
      CI: "true"
      GRADLE_USER_HOME: /root/.gradle
      GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
    image: blender-python-development-local-ci
    platform: ${LOCAL_CI_PLATFORM:-linux/amd64}
    volumes:
      - local-ci-gradle-cache:/root/.gradle

  publish-release-check:
    command:
      - /bin/sh
      - -ec
      - apk add --no-cache curl && command -v curl && command -v glab
    image: registry.gitlab.com/gitlab-org/cli:latest
    platform: ${LOCAL_CI_PLATFORM:-linux/amd64}

volumes:
  local-ci-gradle-cache:
